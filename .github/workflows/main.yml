# nom
name: e2e tests cypress et PHP

# declencheur
on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - feature
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci_cd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout récupération du code
        uses: actions/checkout@v4  # ✅ v6 n'existe pas

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, mbstring, zip
          tools: composer

      - name: MEP du fichier env et BDD  # ✅ AVANT PHP et Cypress
        run: |
          cp .env.docker .env
          echo "DATABASE_HOST=127.0.0.1" >> .env
          echo "DATABASE_PORT=3306" >> .env
          until mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1"; do
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -u root -proot ci_cd < db.sql

      - name: Installer les dépendances
        run: composer install

      - name: Démarrer le serveur PHP  # ✅ AVANT Cypress
        run: php -S 127.0.0.1:8000 -t public &

      - name: Run Cypress  # ✅ EN DERNIER
        uses: cypress-io/github-action@v7

      # CD - déploiement
      - name: Build .env production
        run: |
          echo 'DATABASE_HOST=${{ secrets.DATABASE_HOST }}' >> .env
          echo 'DATABASE_PORT=${{ secrets.DATABASE_PORT }}' >> .env
          echo 'DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}' >> .env
          echo 'DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}' >> .env
          echo 'DATABASE_NAME=${{ secrets.DATABASE_NAME }}' >> .env

      - name: Deployment to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          username: ${{ secrets.FTP_USERNAME }}